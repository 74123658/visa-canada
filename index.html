            background-size: 16px 16px;
        }
    </style>
</head>
<body class="bg-pattern text-slate-800 antialiased min-h-screen p-2 sm:p-4 md:p-6">
    <div id="root" class="w-full max-w-5xl mx-auto"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Custom inline SVG Icons for bulletproof embedded rendering
        const Icons = {
            ShieldCheck: () => (
                <svg className="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                </svg>
            ),
            CheckCircle: ({ className = "w-5 h-5 text-emerald-500" }) => (
                <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            ),
            Plane: () => (
                <svg className="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                </svg>
            ),
            CreditCard: () => (
                <svg className="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a2 2 0 002-2V7a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2z" />
                </svg>
            ),
            WhatsApp: () => (
                <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24">
                    <path d="M12.031 2c-5.517 0-9.993 4.476-9.993 9.993 0 1.763.459 3.487 1.33 5.004L2 22l5.127-1.343c1.46.797 3.109 1.216 4.904 1.216 5.517 0 9.993-4.476 9.993-9.993 0-2.668-1.039-5.176-2.924-7.061A9.925 9.925 0 0012.031 2zm5.823 14.18c-.244.688-1.428 1.312-1.986 1.378-.518.062-1.189.1-3.432-.821-2.87-1.178-4.717-4.103-4.86-4.294-.143-.19-1.162-1.548-1.162-2.951 0-1.403.734-2.091 1.002-2.378.268-.287.587-.358.783-.358.196 0 .393.002.564.01.18.008.423-.068.66.502.245.588.835 2.038.908 2.186.073.148.122.321.024.515-.098.194-.147.315-.292.486-.146.171-.308.384-.44.515-.147.147-.301.308-.129.603.172.296.764 1.26 1.637 2.038 1.122.999 2.072 1.31 2.368 1.458.296.147.469.123.642-.075.172-.198.738-.859.934-1.153.196-.295.393-.245.662-.147.27.098 1.714.808 2.008.955.295.147.491.221.564.343.073.123.073.712-.171 1.401z"/>
                </svg>
            ),
            FileCheck: () => (
                <svg className="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6z" />
                </svg>
            ),
            Lock: () => (
                <svg className="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
            ),
            ArrowRight: () => (
                <svg className="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            ),
            Refresh: () => (
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            ),
            AlertTriangle: () => (
                <svg className="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
            )
        };

        const STORAGE_KEY = 'canada_visa_evaluator_v2';

        // Agency Configuration & Pricing Model
        const AGENCY_CONFIG = {
            whatsappNumber: '527717471124',
            agencyName: 'Visas Canadá Express Global',
            // eTA Pricing: Government Fee ($7 CAD ~ $6 USD) + Agency Service Fee ($33 USD) = $39 USD (~$700 MXN)
            etaGovFeeUSD: 6,
            etaServiceFeeUSD: 33,
            
            // Visa VAM Pricing: Government Fee ($100 CAD + $85 Biometrics ~ $135 USD) + Agency Service Fee ($114 USD) = $249 USD (~$4,480 MXN)
            visaVamGovFeeUSD: 135,
            visaVamServiceFeeUSD: 114,

            // VIP Fast-Track Add-on
            vipServiceFeeUSD: 49,
            
            // Exchange rate for MXN conversion
            usdToMxnRate: 18.0
        };

        function App() {
            // Persistent State Initialization
            const [step, setStep] = useState(1);
            
            // Step 1: Form Data
            const [formData, setFormData] = useState({
                fullName: '',
                phone: '',
                email: '',
                nationality: 'Mexicana',
                etaCondition: 'us_visa', // 'us_visa', 'canada_visa', 'both', 'none'
                travelPurpose: 'Turismo / Vacaciones',
                employmentStatus: 'Empleado con Contrato',
                monthlyIncome: '1,200 - 2,500 USD',
                travelHistory: 'us_and_others',
                legalBackground: 'clean'
            });

            // Step 2: Checklist Items State
            const [checkedDocs, setCheckedDocs] = useState({});

            // Step 3: Payment Form Data
            const [paymentData, setPaymentData] = useState({
                cardNumber: '',
                cardHolder: '',
                expiry: '',
                cvv: '',
                includeVIP: false
            });

            const [isProcessingPayment, setIsProcessingPayment] = useState(false);
            const [paymentSuccess, setPaymentSuccess] = useState(false);
            const [paymentReference, setPaymentReference] = useState('');
            const [errorMessage, setErrorMessage] = useState('');

            // Load saved state on mount
            useEffect(() => {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (parsed.formData) setFormData(parsed.formData);
                        if (parsed.checkedDocs) setCheckedDocs(parsed.checkedDocs);
                        if (parsed.step) setStep(parsed.step);
                        if (parsed.paymentSuccess) setPaymentSuccess(parsed.paymentSuccess);
                        if (parsed.paymentReference) setPaymentReference(parsed.paymentReference);
                    }
                } catch (e) {
                    console.error("Failed to load local storage:", e);
                }
            }, []);

            // Auto-save on state changes
            useEffect(() => {
                try {
                    const payload = { formData, checkedDocs, step, paymentSuccess, paymentReference };
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
                } catch (e) {
                    console.error("Failed to save to local storage:", e);
                }
            }, [formData, checkedDocs, step, paymentSuccess, paymentReference]);

            const evaluationResult = useMemo(() => {
                let score = 50;
                let visaType = 'Visa Consular de Visitante (VAM)';
                let estimatedTime = '15 a 30 días hábiles';
                let govFeeUSD = AGENCY_CONFIG.visaVamGovFeeUSD;
                let serviceFeeUSD = AGENCY_CONFIG.visaVamServiceFeeUSD;
                let isEtaEligible = false;

                // eTA Eligibility rules (IRCC Rule)
                if (formData.nationality === 'Española') {
                    isEtaEligible = true;
                } else if (formData.nationality === 'Mexicana' || formData.nationality === 'Chile') {
                    if (formData.etaCondition && formData.etaCondition !== 'none') {
                        isEtaEligible = true;
                    }
                }

                if (isEtaEligible) {
                    visaType = 'eTA Canadá (Autorización Electrónica)';
                    estimatedTime = '24 a 72 Horas Express';
                    govFeeUSD = AGENCY_CONFIG.etaGovFeeUSD;
                    serviceFeeUSD = AGENCY_CONFIG.etaServiceFeeUSD;
                    score += 35;
                }

                const totalUSD = govFeeUSD + serviceFeeUSD;
                const totalMXN = Math.round(totalUSD * AGENCY_CONFIG.usdToMxnRate);

                // Financial & Work Score
                if (formData.employmentStatus === 'Empleado con Contrato' || formData.employmentStatus === 'Empresario / Negocio propio') {
                    score += 15;
                } else if (formData.employmentStatus === 'Jubilado / Pensionado') {
                    score += 10;
                }

                // Travel history bonus
                if (formData.travelHistory === 'us_and_others') score += 15;
                else if (formData.travelHistory === 'latam') score += 5;

                // Legal disqualifier check
                if (formData.legalBackground === 'issues') {
                    score = Math.min(score, 30);
                }

                score = Math.min(Math.max(score, 20), 98);

                let badgeColor = 'bg-emerald-500';
                let badgeText = 'Viabilidad Muy Alta';
                if (score < 50) {
                    badgeColor = 'bg-amber-500';
                    badgeText = 'Viabilidad Moderada / Requiere Asesoría';
                } else if (score < 75) {
                    badgeColor = 'bg-indigo-600';
                    badgeText = 'Viabilidad Alta';
                }

                return {
                    score,
                    visaType,
                    estimatedTime,
                    isEtaEligible,
                    govFeeUSD,
                    serviceFeeUSD,
                    totalUSD,
                    totalMXN,
                    badgeColor,
                    badgeText
                };
            }, [formData]);

            const dynamicRequirements = useMemo(() => {
                const list = [];
                
                list.push({ id: 'doc_passport', title: 'Pasaporte Vigente', desc: 'Con vigencia mínima de 6 meses desde la fecha prevista de entrada.' });
                
                if (evaluationResult.isEtaEligible) {
                    list.push({ id: 'doc_us_visa', title: 'Visa de EE.UU. Vigente o Visa Canadá Previa', desc: 'Indispensable para aplicar bajo el programa eTA Express.' });
                    list.push({ id: 'doc_email', title: 'Correo Electrónico Activo', desc: 'Para vinculación de la eTA con tu pasaporte.' });
                } else {
                    list.push({ id: 'doc_bank_statements', title: 'Estados de Cuenta Bancarios (3 meses)', desc: 'Demostrar solvencia económica y arraigo financiero.' });
                    list.push({ id: 'doc_employment', title: 'Carta Laboral o Registro de Empresa', desc: 'Comprobante de empleo, antigüedad y permiso de vacaciones.' });
                    list.push({ id: 'doc_arraigo', title: 'Comprobantes de Arraigo', desc: 'Escrituras, contratos de renta, certificados escolares o de matrimonio.' });
                }

                list.push({ id: 'doc_form', title: 'Formulario de Datos Personales (IMM 5257 / eTA)', desc: 'Pre-llenado guiado por nuestro especialista.' });
                list.push({ id: 'doc_payment', title: 'Pago de Tasas Consulares y Gestión', desc: 'Procesamiento de pago seguro para iniciar expediente.' });

                return list;
            }, [evaluationResult]);

            const handleInputChange = (field, value) => {
                setFormData(prev => ({ ...prev, [field]: value }));
            };

            const toggleDocCheck = (id) => {
                setCheckedDocs(prev => ({ ...prev, [id]: !prev[id] }));
            };

            const handleCardNumberChange = (e) => {
                let v = e.target.value.replace(/\D/g, '').substring(0, 16);
                v = v.replace(/(.{4})/g, '$1 ').trim();
                setPaymentData(prev => ({ ...prev, cardNumber: v }));
            };

            const handleExpiryChange = (e) => {
                let v = e.target.value.replace(/\D/g, '').substring(0, 4);
                if (v.length >= 3) {
                    v = `${v.substring(0, 2)}/${v.substring(2)}`;
                }
                setPaymentData(prev => ({ ...prev, expiry: v }));
            };

            const handleProcessPayment = (e) => {
                e.preventDefault();
                setErrorMessage('');

                if (!formData.fullName || !formData.phone) {
                    setErrorMessage('Por favor completa tu nombre y WhatsApp en el Paso 1 antes de realizar el pago.');
                    setStep(1);
                    return;
                }

                if (paymentData.cardNumber.replace(/\s/g, '').length < 15) {
                    setErrorMessage('Ingresa un número de tarjeta válido (16 dígitos).');
                    return;
                }

                if (!paymentData.expiry || paymentData.expiry.length < 5) {
                    setErrorMessage('Ingresa la fecha de expiración MM/AA.');
                    return;
                }

                if (!paymentData.cvv || paymentData.cvv.length < 3) {
                    setErrorMessage('Ingresa un código CVC/CVV válido.');
                    return;
                }

                setIsProcessingPayment(true);

                // Simulate secure payment gateway API call
                setTimeout(() => {
                    setIsProcessingPayment(false);
                    const refCode = 'CAN-' + Math.floor(100000 + Math.random() * 900000);
                    setPaymentReference(refCode);
                    setPaymentSuccess(true);
                    setStep(4);
                }, 1800);
            };

            const generateWhatsAppLink = () => {
                const addOnUSD = paymentData.includeVIP ? AGENCY_CONFIG.vipServiceFeeUSD : 0;
                const grandTotalUSD = evaluationResult.totalUSD + addOnUSD;
                const grandTotalMXN = Math.round(grandTotalUSD * AGENCY_CONFIG.usdToMxnRate);

                let etaText = 'Ninguno (Aplica Visa VAM)';
                if (formData.etaCondition === 'us_visa') etaText = 'Visa EE.UU. Vigente';
                if (formData.etaCondition === 'canada_visa') etaText = 'Visa Canadá Previa';
                if (formData.etaCondition === 'both') etaText = 'Visa EE.UU. + Canadá Previa';

                const text = 
`🇨🇦 *NUEVA SOLICITUD DE VISA CANADÁ* 🇨🇦
----------------------------------
📌 *Cliente:* ${formData.fullName || 'No especificado'}
📱 *Teléfono:* ${formData.phone || 'No especificado'}
✉️ *Email:* ${formData.email || 'No especificado'}

📊 *DIAGNÓSTICO DE VIABILIDAD:*
• *Puntuación:* ${evaluationResult.score}% (${evaluationResult.badgeText})
• *Trámite Sugerido:* ${evaluationResult.visaType}
• *Tiempo estimado:* ${evaluationResult.estimatedTime}
• *Condición eTA:* ${etaText}

📋 *DESGLOSE FINANCIERO:*
• Tasa Oficial Gobierno IRCC: $${evaluationResult.govFeeUSD} USD
• Honorarios de Tramitación: $${evaluationResult.serviceFeeUSD} USD
${paymentData.includeVIP ? `• Servicio VIP Fast-Track: +$${AGENCY_CONFIG.vipServiceFeeUSD} USD\n` : ''}
💰 *TOTAL PAGADO:* $${grandTotalUSD} USD (~$${grandTotalMXN.toLocaleString('es-MX')} MXN)

💳 *CONFIRMACIÓN DE PAGO:*
• *Referencia:* ${paymentSuccess ? paymentReference : 'Pendiente de Pago'}

Hola, he completado mi evaluación y pago en el portal. Deseo agendar mi cita y enviar mis documentos para iniciar el trámite formal de mi Visa a Canadá.`;

                return `https://wa.me/${AGENCY_CONFIG.whatsappNumber}?text=${encodeURIComponent(text)}`;
            };

            const resetForm = () => {
                localStorage.removeItem(STORAGE_KEY);
                setStep(1);
                setPaymentSuccess(false);
                setPaymentReference('');
                setCheckedDocs({});
                setFormData({
                    fullName: '',
                    phone: '',
                    email: '',
                    nationality: 'Mexicana',
                    etaCondition: 'us_visa',
                    travelPurpose: 'Turismo / Vacaciones',
                    employmentStatus: 'Empleado con Contrato',
                    monthlyIncome: '1,200 - 2,500 USD',
                    travelHistory: 'us_and_others',
                    legalBackground: 'clean'
                });
            };

            return (
                <div className="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden my-4 transition-all">
                    {/* Header */}
                    <div className="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 text-white p-6 md:p-8">
                        <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <div>
                                <div className="inline-flex items-center gap-2 bg-red-600/20 text-red-300 border border-red-500/30 px-3 py-1 rounded-full text-xs font-semibold uppercase tracking-wider mb-2">
                                    <Icons.Plane />
                                    <span>Servicio Especializado Canadá IRCC</span>
                                </div>
                                <h1 className="text-2xl md:text-3xl font-extrabold tracking-tight">
                                    Portal de Evaluación & Tramitación Visa Canadá
                                </h1>
                                <p className="text-slate-300 text-sm mt-1">
                                    Diagnóstico de elegibilidad en tiempo real, requisitos personalizados y gestión directa.
                                </p>
                            </div>
                            <div className="flex items-center gap-3 bg-white/10 backdrop-blur-md px-4 py-2.5 rounded-xl border border-white/10 self-start md:self-auto">
                                <Icons.ShieldCheck />
                                <div className="text-xs">
                                    <div className="font-semibold text-emerald-400">Verificación Garantizada</div>
                                    <div className="text-slate-300">Conexión Segura SSL 256-Bit</div>
                                </div>
                            </div>
                        </div>

                        {/* Step Navigation Indicator */}
                        <div className="mt-8 grid grid-cols-4 gap-2 border-t border-slate-800 pt-6">
                            {[
                                { num: 1, label: 'Elegibilidad' },
                                { num: 2, label: 'Requisitos' },
                                { num: 3, label: 'Procesamiento' },
                                { num: 4, label: 'Confirmación' }
                            ].map((s) => (
                                <button
                                    key={s.num}
                                    type="button"
                                    onClick={() => step > s.num && setStep(s.num)}
                                    className={`flex flex-col md:flex-row items-center gap-2 text-left p-2 rounded-lg transition-all ${
                                        step === s.num
                                            ? 'bg-indigo-600 text-white font-semibold shadow-md'
                                            : step > s.num
                                            ? 'text-emerald-400 hover:bg-slate-800/60 cursor-pointer'
                                            : 'text-slate-500 opacity-60'
                                    }`}
                                >
                                    <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ${
                                        step === s.num ? 'bg-white text-indigo-600' : step > s.num ? 'bg-emerald-500 text-slate-900' : 'bg-slate-800 text-slate-400'
                                    }`}>
                                        {step > s.num ? '✓' : s.num}
                                    </span>
                                    <span className="text-xs hidden sm:inline">{s.label}</span>
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Main Content Area */}
                    <div className="p-6 md:p-8">
                        {/* STEP 1: Form & Evaluation */}
                        {step === 1 && (
                            <div className="space-y-6">
                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                    {/* Left Col: Questionnaire Inputs */}
                                    <div className="lg:col-span-2 space-y-5">
                                        <div className="border-b border-slate-200 pb-3">
                                            <h2 className="text-lg font-bold text-slate-900 flex items-center gap-2">
                                                <span className="w-7 h-7 bg-indigo-100 text-indigo-700 rounded-lg flex items-center justify-center text-sm">1</span>
                                                Información Básica del Solicitante
                                            </h2>
                                            <p className="text-xs text-slate-500 mt-1">Completa los campos para calcular tu porcentaje de aprobación al instante.</p>
                                        </div>

                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-700 mb-1">Nombre Completo *</label>
                                                <input 
                                                    type="text" 
                                                    required
                                                    placeholder="Ej. Juan Pérez"
                                                    value={formData.fullName}
                                                    onChange={(e) => handleInputChange('fullName', e.target.value)}
                                                    className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-700 mb-1">Teléfono / WhatsApp *</label>
                                                <input 
                                                    type="tel" 
                                                    required
                                                    placeholder="Ej. 7717471124"
                                                    value={formData.phone}
                                                    onChange={(e) => handleInputChange('phone', e.target.value)}
                                                    className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
                                                />
                                            </div>
                                        </div>

                                        <div>
                                            <label className="block text-xs font-semibold text-slate-700 mb-1">Correo Electrónico</label>
                                            <input 
                                                type="email" 
                                                placeholder="correo@ejemplo.com"
                                                value={formData.email}
                                                onChange={(e) => handleInputChange('email', e.target.value)}
                                                className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
                                            />
                                        </div>

                                        {/* Key eTA questions - Single Selection Cards */}
                                        <div className="bg-indigo-50/70 p-4 rounded-xl border border-indigo-100 space-y-3">
                                            <h3 className="text-xs font-bold text-indigo-900 uppercase tracking-wide">
                                                🔍 Requisito Clave para Trámite Express (eTA)
                                            </h3>
                                            <p className="text-xs text-slate-600 mb-2">
                                                Selecciona únicamente la opción que corresponda a tu caso actual:
                                            </p>

                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                                                {[
                                                    { id: 'us_visa', label: 'Tengo Visa de EE.UU. vigente', desc: 'Turismo B1/B2' },
                                                    { id: 'canada_visa', label: 'Tuve Visa de Canadá', desc: 'En los últimos 10 años' },
                                                    { id: 'both', label: 'Tengo ambas visas', desc: 'EE.UU. vigente + Canadá previa' },
                                                    { id: 'none', label: 'No tengo ninguna de las dos', desc: 'Aplica Visa Consular (VAM)' }
                                                ].map((opt) => {
                                                    const isSelected = formData.etaCondition === opt.id;
                                                    return (
                                                        <button
                                                            key={opt.id}
                                                            type="button"
                                                            onClick={() => handleInputChange('etaCondition', opt.id)}
                                                            className={`text-left p-3 rounded-xl border transition-all flex flex-col justify-between ${
                                                                isSelected
                                                                    ? 'bg-indigo-600 text-white border-indigo-600 shadow-md ring-2 ring-indigo-300'
                                                                    : 'bg-white text-slate-800 border-slate-200 hover:border-indigo-300'
                                                            }`}
                                                        >
                                                            <div className="flex items-center justify-between w-full">
                                                                <span className="font-bold text-xs">{opt.label}</span>
                                                                <div className={`w-4 h-4 rounded-full border flex items-center justify-center ${
                                                                    isSelected ? 'border-white bg-white text-indigo-600' : 'border-slate-300'
                                                                }`}>
                                                                    {isSelected && <div className="w-2 h-2 rounded-full bg-indigo-600"></div>}
                                                                </div>
                                                            </div>
                                                            <span className={`text-2xs mt-1 ${isSelected ? 'text-indigo-100' : 'text-slate-500'}`}>
                                                                {opt.desc}
                                                            </span>
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-700 mb-1">Nacionalidad / Pasaporte</label>
                                                <select
                                                    value={formData.nationality}
                                                    onChange={(e) => handleInputChange('nationality', e.target.value)}
                                                    className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-white"
                                                >
                                                    <option value="Mexicana">Mexicana</option>
                                                    <option value="Española">Española (UE)</option>
                                                    <option value="Chile">Chilena</option>
                                                    <option value="Colombiana">Colombiana</option>
                                                    <option value="Peruana">Peruana</option>
                                                    <option value="Argentina">Argentina</option>
                                                    <option value="Otra">Otra Nacionalidad</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-700 mb-1">Motivo Principal de Viaje</label>
                                                <select
                                                    value={formData.travelPurpose}
                                                    onChange={(e) => handleInputChange('travelPurpose', e.target.value)}
                                                    className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-white"
                                                >
                                                    <option value="Turismo / Vacaciones">Turismo / Vacaciones</option>
                                                    <option value="Visitar Familia / Amigos">Visitar Familia / Amigos</option>
                                                    <option value="Negocios / Evento">Negocios / Evento Corto</option>
                                                    <option value="Tránsito en Aeropuerto">Tránsito por Aeropuerto</option>
                                                </select>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-700 mb-1">Situación Laboral / Ocupación</label>
                                                <select
                                                    value={formData.employmentStatus}
                                                    onChange={(e) => handleInputChange('employmentStatus', e.target.value)}
                                                    className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-white"
                                                >
                                                    <option value="Empleado con Contrato">Empleado Formal con Contrato</option>
                                                    <option value="Empresario / Negocio propio">Empresario / Independiente Registrado</option>
                                                    <option value="Jubilado / Pensionado">Jubilado / Pensionado</option>
                                                    <option value="Estudiante">Estudiante Universitario / Posgrado</option>
                                                    <option value="Sin Empleo Actual">Sin empleo formal actual</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-700 mb-1">Historial de Viajes Internacionales (Últimos 5 años)</label>
                                                <select
                                                    value={formData.travelHistory}
                                                    onChange={(e) => handleInputChange('travelHistory', e.target.value)}
                                                    className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-white"
                                                >
                                                    <option value="us_and_others">EE.UU., Europa, Reino Unido u otros continentes</option>
                                                    <option value="latam">Solo Latinoamérica / Caribe</option>
                                                    <option value="none">Primer viaje al extranjero</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Right Col: Live Diagnostic Result Card */}
                                    <div className="bg-slate-900 text-white p-6 rounded-2xl shadow-lg border border-slate-800 flex flex-col justify-between">
                                        <div>
                                            <div className="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
                                                <span className="text-xs uppercase font-bold text-slate-400 tracking-wider">Resultado del Diagnóstico</span>
                                                <span className={`px-2.5 py-0.5 rounded-full text-xs font-bold text-white ${evaluationResult.badgeColor}`}>
                                                    {evaluationResult.score}% Viable
                                                </span>
                                            </div>

                                            {/* Score Progress Circle */}
                                            <div className="my-4 text-center">
                                                <div className="inline-flex items-center justify-center p-4 bg-slate-800 rounded-2xl border border-slate-700 w-full">
                                                    <div>
                                                        <div className="text-3xl font-extrabold text-emerald-400">
                                                            {evaluationResult.score}/100
                                                        </div>
                                                        <div className="text-xs text-slate-300 font-medium mt-1">
                                                            {evaluationResult.badgeText}
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="space-y-3 text-xs border-t border-slate-800 pt-4">
                                                <div>
                                                    <span className="text-slate-400 block">Tipo de Trámite Sugerido:</span>
                                                    <span className="font-bold text-indigo-300 text-sm">{evaluationResult.visaType}</span>
                                                </div>
                                                <div>
                                                    <span className="text-slate-400 block">Tiempo Estimado de Resolución:</span>
                                                    <span className="font-semibold text-white">{evaluationResult.estimatedTime}</span>
                                                </div>
                                                
                                                {/* Transparent Pricing Breakdown */}
                                                <div className="bg-slate-800/80 p-3 rounded-xl border border-slate-700/60 space-y-1.5 mt-2">
                                                    <div className="flex justify-between text-slate-400 text-2xs">
                                                        <span>Tasa Oficial Consular (IRCC):</span>
                                                        <span>${evaluationResult.govFeeUSD} USD</span>
                                                    </div>
                                                    <div className="flex justify-between text-slate-400 text-2xs">
                                                        <span>Honorarios Gestión & Asesoría:</span>
                                                        <span>${evaluationResult.serviceFeeUSD} USD</span>
                                                    </div>
                                                    <div className="flex justify-between font-bold text-emerald-400 text-xs pt-1 border-t border-slate-700">
                                                        <span>Total a Cancelar:</span>
                                                        <span>${evaluationResult.totalUSD} USD (~${evaluationResult.totalMXN.toLocaleString('es-MX')} MXN)</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="mt-6 pt-4 border-t border-slate-800">
                                            <button
                                                type="button"
                                                onClick={() => {
                                                    if (!formData.fullName || !formData.phone) {
                                                        setErrorMessage('Por favor escribe tu Nombre y WhatsApp para continuar.');
                                                        return;
                                                    }
                                                    setErrorMessage('');
                                                    setStep(2);
                                                }}
                                                className="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 px-4 rounded-xl shadow-md transition-all flex items-center justify-center text-sm"
                                            >
                                                <span>Ver Requisitos & Continuar</span>
                                                <Icons.ArrowRight />
                                            </button>
                                            {errorMessage && (
                                                <p className="text-amber-400 text-xs mt-2 text-center font-medium">
                                                    {errorMessage}
                                                </p>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* STEP 2: Requirements Checklist */}
                        {step === 2 && (
                            <div className="space-y-6">
                                <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-200 pb-4">
                                    <div>
                                        <h2 className="text-lg font-bold text-slate-900 flex items-center gap-2">
                                            <span className="w-7 h-7 bg-indigo-100 text-indigo-700 rounded-lg flex items-center justify-center text-sm">2</span>
                                            Expediente de Requisitos Personalizados
                                        </h2>
                                        <p className="text-xs text-slate-500 mt-1">
                                            Basado en tu perfil: <span className="font-semibold text-indigo-600">{evaluationResult.visaType}</span>
                                        </p>
                                    </div>

                                    <div className="bg-emerald-50 text-emerald-800 px-4 py-2 rounded-xl border border-emerald-200 text-xs font-semibold flex items-center gap-2">
                                        <Icons.FileCheck />
                                        <span>{Object.values(checkedDocs).filter(Boolean).length} de {dynamicRequirements.length} Documentos Preparados</span>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {dynamicRequirements.map((req) => {
                                        const isChecked = !!checkedDocs[req.id];
                                        return (
                                            <div
                                                key={req.id}
                                                onClick={() => toggleDocCheck(req.id)}
                                                className={`p-4 rounded-xl border transition-all cursor-pointer flex items-start gap-3.5 ${
                                                    isChecked
                                                        ? 'bg-emerald-50/60 border-emerald-300 shadow-sm'
                                                        : 'bg-white border-slate-200 hover:border-slate-300'
                                                }`}
                                            >
                                                <div className={`mt-0.5 w-5 h-5 rounded border flex items-center justify-center transition-all ${
                                                    isChecked ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 bg-white'
                                                }`}>
                                                    {isChecked && '✓'}
                                                </div>
                                                <div>
                                                    <h3 className={`text-sm font-bold ${isChecked ? 'text-emerald-950 line-through opacity-80' : 'text-slate-800'}`}>
                                                        {req.title}
                                                    </h3>
                                                    <p className="text-xs text-slate-500 mt-0.5">{req.desc}</p>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>

                                <div className="bg-indigo-50 border border-indigo-100 p-4 rounded-xl text-xs text-indigo-900 flex items-start gap-3">
                                    <Icons.AlertTriangle />
                                    <div>
                                        <span className="font-bold block mb-0.5">Asistencia Profesional Incluida:</span>
                                        No te preocupes si no tienes todos los documentos escaneados hoy. Nuestro equipo legal te asistirá en la revisión, llenado oficial y carga de expedientes ante el consulado canadiense.
                                    </div>
                                </div>

                                <div className="flex items-center justify-between pt-4 border-t border-slate-200">
                                    <button
                                        type="button"
                                        onClick={() => setStep(1)}
                                        className="text-xs font-semibold text-slate-600 hover:text-slate-900 px-4 py-2 rounded-lg border border-slate-200"
                                    >
                                        ← Volver al Diagnóstico
                                    </button>

                                    <button
                                        type="button"
                                        onClick={() => setStep(3)}
                                        className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl shadow-md transition-all flex items-center gap-2 text-sm"
                                    >
                                        <span>Proceder al Pago & Tramitación</span>
                                        <Icons.ArrowRight />
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* STEP 3: Payment Gateway */}
                        {step === 3 && (
                            <div className="space-y-6">
                                <div className="border-b border-slate-200 pb-4">
                                    <h2 className="text-lg font-bold text-slate-900 flex items-center gap-2">
                                        <span className="w-7 h-7 bg-indigo-100 text-indigo-700 rounded-lg flex items-center justify-center text-sm">3</span>
                                        Pasarela de Pago Seguro de Honorarios
                                    </h2>
                                    <p className="text-xs text-slate-500 mt-1">
                                        Aceptamos Tarjetas de Crédito y Débito (Visa, Mastercard, Amex).
                                    </p>
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                    {/* Left Col: Order Summary */}
                                    <div className="bg-slate-50 p-5 rounded-2xl border border-slate-200 space-y-4">
                                        <h3 className="text-xs font-bold text-slate-700 uppercase tracking-wide border-b border-slate-200 pb-2">
                                            Desglose Transparente de Tarifas
                                        </h3>

                                        <div className="space-y-2.5 text-xs">
                                            <div className="flex justify-between items-center text-slate-600">
                                                <span>Tasa Consular e Impuestos (IRCC):</span>
                                                <span className="font-semibold text-slate-800">${evaluationResult.govFeeUSD} USD</span>
                                            </div>

                                            <div className="flex justify-between items-center text-slate-600">
                                                <span>Gestión, Revisión de Expediente & Llenado:</span>
                                                <span className="font-semibold text-indigo-600">${evaluationResult.serviceFeeUSD} USD</span>
                                            </div>

                                            {paymentData.includeVIP && (
                                                <div className="flex justify-between items-center text-indigo-700 font-semibold pt-2 border-t border-slate-200">
                                                    <span>Garantía Fast-Track VIP (+Cita Prioritaria)</span>
                                                    <span>+${AGENCY_CONFIG.vipServiceFeeUSD} USD</span>
                                                </div>
                                            )}

                                            <div className="pt-3 border-t border-slate-200 flex justify-between items-end">
                                                <div>
                                                    <span className="font-extrabold text-slate-900 text-sm block">Total a Pagar:</span>
                                                    <span className="text-slate-500 text-2xs">Incluye tasas + servicio</span>
                                                </div>
                                                <div className="text-right">
                                                    <div className="text-xl font-black text-emerald-600">
                                                        ${evaluationResult.totalUSD + (paymentData.includeVIP ? AGENCY_CONFIG.vipServiceFeeUSD : 0)} USD
                                                    </div>
                                                    <div className="text-xs text-slate-500 font-medium">
                                                        (~${Math.round((evaluationResult.totalUSD + (paymentData.includeVIP ? AGENCY_CONFIG.vipServiceFeeUSD : 0)) * AGENCY_CONFIG.usdToMxnRate).toLocaleString('es-MX')} MXN)
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Optional Add-on checkbox */}
                                        <div className="bg-white p-3 rounded-xl border border-indigo-200 text-xs space-y-2 mt-4">
                                            <label className="flex items-start gap-2.5 cursor-pointer">
                                                <input 
                                                    type="checkbox"
                                                    checked={paymentData.includeVIP}
                                                    onChange={(e) => setPaymentData(prev => ({ ...prev, includeVIP: e.target.checked }))}
                                                    className="mt-0.5 rounded text-indigo-600 focus:ring-indigo-500"
                                                />
                                                <div>
                                                    <span className="font-bold text-indigo-900 block">Añadir Garantía VIP Fast-Track (+${AGENCY_CONFIG.vipServiceFeeUSD} USD)</span>
                                                    <span className="text-slate-500 text-2xs">Revisión de expediente en menos de 2 horas y asignación de gestor personalizado vía telefónica.</span>
                                                </div>
                                            </label>
                                        </div>

                                        <div className="flex items-center gap-2 text-xs text-slate-500 pt-2">
                                            <Icons.Lock />
                                            <span>Encriptación de grado bancario SSL 256-Bit</span>
                                        </div>
                                    </div>

                                    {/* Right Col: Payment Card Form */}
                                    <div className="lg:col-span-2">
                                        <form onSubmit={handleProcessPayment} className="space-y-4">
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-700 mb-1">Titular de la Tarjeta</label>
                                                <input 
                                                    type="text"
                                                    required
                                                    placeholder="Nombre como aparece en la tarjeta"
                                                    value={paymentData.cardHolder}
                                                    onChange={(e) => setPaymentData(prev => ({ ...prev, cardHolder: e.target.value }))}
                                                    className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
                                                />
                                            </div>

                                            <div>
                                                <label className="block text-xs font-semibold text-slate-700 mb-1">Número de Tarjeta (Débito o Crédito)</label>
                                                <div className="relative">
                                                    <input 
                                                        type="text"
                                                        required
                                                        placeholder="4500 0000 0000 0000"
                                                        value={paymentData.cardNumber}
                                                        onChange={handleCardNumberChange}
                                                        className="w-full pl-3.5 pr-10 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-mono"
                                                    />
                                                    <div className="absolute right-3 top-3">
                                                        <Icons.CreditCard />
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="grid grid-cols-2 gap-4">
                                                <div>
                                                    <label className="block text-xs font-semibold text-slate-700 mb-1">Expiración (MM/AA)</label>
                                                    <input 
                                                        type="text"
                                                        required
                                                        placeholder="MM/AA"
                                                        value={paymentData.expiry}
                                                        onChange={handleExpiryChange}
                                                        className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-mono text-center"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-semibold text-slate-700 mb-1">Código CVC / CVV</label>
                                                    <input 
                                                        type="password"
                                                        required
                                                        maxLength="4"
                                                        placeholder="123"
                                                        value={paymentData.cvv}
                                                        onChange={(e) => setPaymentData(prev => ({ ...prev, cvv: e.target.value.replace(/\D/g, '') }))}
                                                        className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-mono text-center"
                                                    />
                                                </div>
                                            </div>

                                            {errorMessage && (
                                                <div className="p-3 bg-red-50 border border-red-200 text-red-700 text-xs rounded-xl flex items-center gap-2">
                                                    <Icons.AlertTriangle />
                                                    <span>{errorMessage}</span>
                                                </div>
                                            )}

                                            <div className="pt-4 flex items-center justify-between">
                                                <button
                                                    type="button"
                                                    onClick={() => setStep(2)}
                                                    className="text-xs font-semibold text-slate-600 hover:text-slate-900 px-4 py-2 rounded-lg border border-slate-200"
                                                >
                                                    ← Volver
                                                </button>

                                                <button
                                                    type="submit"
                                                    disabled={isProcessingPayment}
                                                    className={`bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-extrabold py-3.5 px-8 rounded-xl shadow-lg transition-all flex items-center gap-2 text-sm ${
                                                        isProcessingPayment ? 'opacity-70 cursor-not-allowed' : ''
                                                    }`}
                                                >
                                                    {isProcessingPayment ? (
                                                        <>
                                                            <div className="w-4 h-4 border-2 border-slate-950 border-t-transparent rounded-full animate-spin"></div>
                                                            <span>Procesando Pago Seguro...</span>
                                                        </>
                                                    ) : (
                                                        <>
                                                            <Icons.Lock />
                                                            <span>Pagar ${evaluationResult.totalUSD + (paymentData.includeVIP ? AGENCY_CONFIG.vipServiceFeeUSD : 0)} USD y Agendar</span>
                                                        </>
                                                    )}
                                                </button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* STEP 4: Confirmation & WhatsApp Schedule */}
                        {step === 4 && (
                            <div className="space-y-6 text-center max-w-2xl mx-auto py-4">
                                <div className="inline-flex items-center justify-center w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full mb-2">
                                    <Icons.CheckCircle className="w-10 h-10 text-emerald-600" />
                                </div>

                                <div>
                                    <h2 className="text-2xl font-extrabold text-slate-900">
                                        ¡Pago Procesado Exitosamente!
                                    </h2>
                                    <p className="text-sm text-slate-600 mt-1">
                                        Tu pre-expediente para la <span className="font-semibold">{evaluationResult.visaType}</span> ha sido registrado.
                                    </p>
                                </div>

                                {/* Order Receipt Card */}
                                <div className="bg-slate-50 p-6 rounded-2xl border border-slate-200 text-left space-y-3 text-xs">
                                    <div className="flex justify-between items-center border-b border-slate-200 pb-3">
                                        <span className="text-slate-500">Clave de Referencia:</span>
                                        <span className="font-mono font-bold text-slate-900 bg-slate-200 px-2 py-1 rounded text-sm">
                                            {paymentReference || 'CAN-839210'}
                                        </span>
                                    </div>
                                    <div className="flex justify-between">
                                        <span className="text-slate-500">Solicitante:</span>
                                        <span className="font-semibold text-slate-800">{formData.fullName || 'Registrado'}</span>
                                    </div>
                                    <div className="flex justify-between">
                                        <span className="text-slate-500">Puntuación de Viabilidad:</span>
                                        <span className="font-bold text-emerald-600">{evaluationResult.score}% (Aprobación Alta)</span>
                                    </div>
                                    <div className="flex justify-between">
                                        <span className="text-slate-500">Trámite Correspondiente:</span>
                                        <span className="font-semibold text-indigo-700">{evaluationResult.visaType}</span>
                                    </div>
                                </div>

                                {/* Main WhatsApp Call-to-Action */}
                                <div className="bg-emerald-50 border border-emerald-200 p-6 rounded-2xl space-y-4">
                                    <h3 className="text-base font-bold text-emerald-950">
                                        🚀 Último Paso: Agendar tu Cita con el Especialista
                                    </h3>
                                    <p className="text-xs text-emerald-800">
                                        Haz clic en el siguiente botón para enviar tu ficha de evaluación pre-llenada y comprobante de pago directamente a nuestro WhatsApp oficial (+52 771 747 1124). Te asignaremos un asesor en minutos.
                                    </p>

                                    <a
                                        href={generateWhatsAppLink()}
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        className="inline-flex items-center justify-center gap-3 w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-4 px-6 rounded-xl shadow-lg transition-all text-base"
                                    >
                                        <Icons.WhatsApp />
                                        <span>Agendar Cita en WhatsApp Ahora</span>
                                    </a>
                                </div>

                                <div className="pt-4 flex justify-center">
                                    <button
                                        type="button"
                                        onClick={resetForm}
                                        className="text-xs text-slate-500 hover:text-slate-800 flex items-center gap-1.5 underline"
                                    >
                                        <Icons.Refresh />
                                        <span>Iniciar una nueva evaluación</span>
                                    </button>
                                </div>
                            </div>
                        )}

                    </div>

                    {/* Footer */}
                    {}
                    <div className="bg-slate-50 border-t border-slate-200 px-6 py-4 flex flex-col sm:flex-row items-center justify-between text-2xs text-slate-500 gap-2">
                        <div>
                            © 2026 {AGENCY_CONFIG.agencyName} • Gestión de Visados y eTA Canadá
                        </div>
                        <div className="flex items-center gap-4">
                            <span>Aviso de Privacidad</span>
                            <span>•</span>
                            <span>Términos del Servicio</span>
                            <span>•</span>
                            <span className="text-emerald-600 font-semibold">Garantía de Tramitación</span>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
