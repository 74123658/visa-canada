<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluador Express & Portal de Tramitación - Visa Canadá</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel Standalone for JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .bg-pattern {
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 0.8px, transparent 0.8px);
            background-size: 16px 16px;
        }
    </style>
</head>
<body class="bg-pattern text-slate-800 antialiased min-h-screen p-2 sm:p-4 md:p-6">
    <div id="root" class="w-full max-w-5xl mx-auto"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Custom inline SVG Icons for embedded rendering
        const Icons = {
            ShieldCheck: () => (
                <svg className="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                </svg>
            ),
            CheckCircle: ({ className = "w-5 h-5 text-emerald-500" }) => (
                <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            ),
            Plane: () => (
                <svg className="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                </svg>
            ),
            CreditCard: () => (
                <svg className="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a2 2 0 002-2V7a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2z" />
                </svg>
            ),
            WhatsApp: () => (
                <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24">
                    <path d="M12.031 2c-5.517 0-9.993 4.476-9.993 9.993 0 1.763.459 3.487 1.33 5.004L2 22l5.127-1.343c1.46.797 3.109 1.216 4.904 1.216 5.517 0 9.993-4.476 9.993-9.993 0-2.668-1.039-5.176-2.924-7.061A9.925 9.925 0 0012.031 2zm5.823 14.18c-.244.688-1.428 1.312-1.986 1.378-.518.062-1.189.1-3.432-.821-2.87-1.178-4.717-4.103-4.86-4.294-.143-.19-1.162-1.548-1.162-2.951 0-1.403.734-2.091 1.002-2.378.268-.287.587-.358.783-.358.196 0 .393.002.564.01.18.008.423-.068.66.502.245.588.835 2.038.908 2.186.073.148.122.321.024.515-.098.194-.147.315-.292.486-.146.171-.308.384-.44.515-.147.147-.301.308-.129.603.172.296.764 1.26 1.637 2.038 1.122.999 2.072 1.31 2.368 1.458.296.147.469.123.642-.075.172-.198.738-.859.934-1.153.196-.295.393-.245.662-.147.27.098 1.714.808 2.008.955.295.147.491.221.564.343.073.123.073.712-.171 1.401z"/>
                </svg>
            ),
            FileCheck: () => (
                <svg className="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6z" />
                </svg>
            ),
            Lock: () => (
                <svg className="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
            ),
            ArrowRight: () => (
                <svg className="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            ),
            ExternalLink: () => (
                <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                </svg>
            ),
            Refresh: () => (
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            ),
            AlertTriangle: () => (
                <svg className="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
            ),
            Calendar: () => (
                <svg className="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
            ),
            MapPin: () => (
                <svg className="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            ),
            UserCheck: () => (
                <svg className="w-5 h-5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
            )
        };

        const STORAGE_KEY = 'canada_visa_evaluator_v2';

        // Official Direct Links to Embassies & Government Portals
        const OFFICIAL_DIRECT_LINKS = {
            canadaEtaOfficial: 'https://www.canada.ca/en/immigration-refugees-citizenship/services/visit-canada/eta/apply-es.html',
            canadaVamOfficial: 'https://www.canada.ca/en/immigration-refugees-citizenship/services/application/account.html',
            usVisaOfficial: 'https://ais.usvisa-info.com/es-mx/niv'
        };

        // Agency Configuration & Pricing Model
        const AGENCY_CONFIG = {
            whatsappNumber: '527717471124',
            agencyName: 'Visas Canadá Express Global',
            // eTA Pricing: Government Fee ($7 CAD ~ $6 USD) + Agency Service Fee ($33 USD) = $39 USD (~$700 MXN)
            etaGovFeeUSD: 6,
            etaServiceFeeUSD: 33,
            
            // Visa VAM Pricing: Government Fee ($100 CAD + $85 Biometrics ~ $135 USD) + Agency Service Fee ($114 USD) = $249 USD (~$4,480 MXN)
            visaVamGovFeeUSD: 135,
            visaVamServiceFeeUSD: 114,

            // VIP Fast-Track Add-on
            vipServiceFeeUSD: 49,
            
            // Exchange rate for MXN conversion
            usdToMxnRate: 18.0
        };

        function App() {
            const [step, setStep] = useState(1);
            
            // Step 1: Form Data
            const [formData, setFormData] = useState({
                fullName: '',
                phone: '',
                phoneCode: '+52',
                email: '',
                nationality: 'Mexicana',
                etaCondition: 'us_visa', // 'us_visa', 'canada_visa', 'both', 'none'
                travelPurpose: 'Turismo / Vacaciones',
                employmentStatus: 'Empleado con Contrato',
                monthlyIncome: '1,200 - 2,500 USD',
                travelHistory: 'us_and_others',
                legalBackground: 'clean'
            });

            // Step 2: Checklist Items State
            const [checkedDocs, setCheckedDocs] = useState({});

            // Step 3: Payment Form Data
            const [paymentData, setPaymentData] = useState({
                cardNumber: '',
                cardHolder: '',
                expiry: '',
                cvv: '',
                includeVIP: false
            });

            // Step 4: Appointment & Biometrics Preferences
            const [appointmentData, setAppointmentData] = useState({
                preferredDate: new Date(Date.now() + 86400000 * 2).toISOString().split('T')[0], // Default 2 days ahead
                preferredTimeSlot: 'Mañana (09:00 - 12:00 hrs)',
                attendanceType: 'Videollamada por WhatsApp',
                preferredBiometricsCity: 'Ciudad de México (VFS Global CDMX)'
            });

            const [isProcessingPayment, setIsProcessingPayment] = useState(false);
            const [paymentSuccess, setPaymentSuccess] = useState(false);
            const [paymentReference, setPaymentReference] = useState('');
            const [errorMessage, setErrorMessage] = useState('');

            // Load saved state on mount
            useEffect(() => {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (parsed.formData) setFormData(parsed.formData);
                        if (parsed.checkedDocs) setCheckedDocs(parsed.checkedDocs);
                        if (parsed.step) setStep(parsed.step);
                        if (parsed.paymentSuccess) setPaymentSuccess(parsed.paymentSuccess);
                        if (parsed.paymentReference) setPaymentReference(parsed.paymentReference);
                        if (parsed.appointmentData) setAppointmentData(parsed.appointmentData);
                    }
                } catch (e) {
                    console.error("Failed to load local storage:", e);
                }
            }, []);

            // Auto-save on state changes
            useEffect(() => {
                try {
                    const payload = { formData, checkedDocs, step, paymentSuccess, paymentReference, appointmentData };
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
                } catch (e) {
                    console.error("Failed to save to local storage:", e);
                }
            }, [formData, checkedDocs, step, paymentSuccess, paymentReference, appointmentData]);

            const evaluationResult = useMemo(() => {
                let score = 50;
                let visaType = 'Visa Consular de Visitante (VAM)';
                let estimatedTime = '15 a 30 días hábiles';
                let govFeeUSD = AGENCY_CONFIG.visaVamGovFeeUSD;
                let serviceFeeUSD = AGENCY_CONFIG.visaVamServiceFeeUSD;
                let isEtaEligible = false;

                // eTA Eligibility rules (IRCC Rule)
                if (formData.nationality === 'Española') {
                    isEtaEligible = true;
                } else if (formData.nationality === 'Mexicana' || formData.nationality === 'Chile') {
                    if (formData.etaCondition && formData.etaCondition !== 'none') {
                        isEtaEligible = true;
                    }
                }

                if (isEtaEligible) {
                    visaType = 'eTA Canadá (Autorización Electrónica)';
                    estimatedTime = '24 a 72 Horas Express';
                    govFeeUSD = AGENCY_CONFIG.etaGovFeeUSD;
                    serviceFeeUSD = AGENCY_CONFIG.etaServiceFeeUSD;
                    score += 35;
                }

                const totalUSD = govFeeUSD + serviceFeeUSD;
                const totalMXN = Math.round(totalUSD * AGENCY_CONFIG.usdToMxnRate);

                // Financial & Work Score
                if (formData.employmentStatus === 'Empleado con Contrato' || formData.employmentStatus === 'Empresario / Negocio propio') {
                    score += 15;
                } else if (formData.employmentStatus === 'Jubilado / Pensionado') {
                    score += 10;
                }

                // Travel history bonus
                if (formData.travelHistory === 'us_and_others') score += 15;
                else if (formData.travelHistory === 'latam') score += 5;

                // Legal disqualifier check
                if (formData.legalBackground === 'issues') {
                    score = Math.min(score, 30);
                }

                score = Math.min(Math.max(score, 20), 98);

                let badgeColor = 'bg-emerald-500';
                let badgeText = 'Viabilidad Muy Alta';
                if (score < 50) {
                    badgeColor = 'bg-amber-500';
                    badgeText = 'Viabilidad Moderada / Requiere Asesoría';
                } else if (score < 75) {
                    badgeColor = 'bg-indigo-600';
                    badgeText = 'Viabilidad Alta';
                }

                return {
                    score,
                    visaType,
                    estimatedTime,
                    isEtaEligible,
                    govFeeUSD,
                    serviceFeeUSD,
                    totalUSD,
                    totalMXN,
                    badgeColor,
                    badgeText
                };
            }, [formData]);

            const dynamicRequirements = useMemo(() => {
                const list = [];
                
                list.push({ id: 'doc_passport', title: 'Pasaporte Vigente', desc: 'Con vigencia mínima de 6 meses desde la fecha prevista de entrada.' });
                
                if (evaluationResult.isEtaEligible) {
                    list.push({ id: 'doc_us_visa', title: 'Visa de EE.UU. Vigente o Visa Canadá Previa', desc: 'Indispensable para aplicar bajo el programa eTA Express.' });
                    list.push({ id: 'doc_email', title: 'Correo Electrónico Activo', desc: 'Para vinculación de la eTA con tu pasaporte.' });
                } else {
                    list.push({ id: 'doc_bank_statements', title: 'Estados de Cuenta Bancarios (3 meses)', desc: 'Demostrar solvencia económica y arraigo financiero.' });
                    list.push({ id: 'doc_employment', title: 'Carta Laboral o Registro de Empresa', desc: 'Comprobante de empleo, antigüedad y permiso de vacaciones.' });
                    list.push({ id: 'doc_arraigo', title: 'Comprobantes de Arraigo', desc: 'Escrituras, contratos de renta, certificados escolares o de matrimonio.' });
                }

                list.push({ id: 'doc_form', title: 'Formulario de Datos Personales (IMM 5257 / eTA)', desc: 'Pre-llenado guiado por nuestro especialista.' });
                list.push({ id: 'doc_payment', title: 'Pago de Tasas Consulares y Gestión', desc: 'Procesamiento de pago seguro para iniciar expediente.' });

                return list;
            }, [evaluationResult]);

            const handleInputChange = (field, value) => {
                setFormData(prev => ({ ...prev, [field]: value }));
            };

            const handlePhoneChange = (e) => {
                let cleaned = e.target.value.replace(/\D/g, '');
                // Restrict to 10 digits if country code is Mexico (+52)
                if (formData.phoneCode === '+52' && cleaned.length > 10) {
                    cleaned = cleaned.substring(0, 10);
                } else if (cleaned.length > 15) {
                    cleaned = cleaned.substring(0, 15);
                }
                setFormData(prev => ({ ...prev, phone: cleaned }));
            };

            const toggleDocCheck = (id) => {
                setCheckedDocs(prev => ({ ...prev, [id]: !prev[id] }));
            };

            const handleCardNumberChange = (e) => {
                let v = e.target.value.replace(/\D/g, '').substring(0, 16);
                v = v.replace(/(.{4})/g, '$1 ').trim();
                setPaymentData(prev => ({ ...prev, cardNumber: v }));
            };

            const handleExpiryChange = (e) => {
                let v = e.target.value.replace(/\D/g, '').substring(0, 4);
                if (v.length >= 3) {
                    v = `${v.substring(0, 2)}/${v.substring(2)}`;
                }
                setPaymentData(prev => ({ ...prev, expiry: v }));
            };

            const handleProcessPayment = (e) => {
                e.preventDefault();
                setErrorMessage('');

                if (!formData.fullName || !formData.phone) {
                    setErrorMessage('Por favor completa tu nombre y WhatsApp en el Paso 1 antes de realizar el pago.');
                    setStep(1);
                    return;
                }

                if (formData.phoneCode === '+52' && formData.phone.length !== 10) {
                    setErrorMessage('El número de WhatsApp para México debe ser exactamente de 10 dígitos.');
                    setStep(1);
                    return;
                }

                if (paymentData.cardNumber.replace(/\s/g, '').length < 15) {
                    setErrorMessage('Ingresa un número de tarjeta válido (16 dígitos).');
                    return;
                }

                if (!paymentData.expiry || paymentData.expiry.length < 5) {
                    setErrorMessage('Ingresa la fecha de expiración MM/AA.');
                    return;
                }

                if (!paymentData.cvv || paymentData.cvv.length < 3) {
                    setErrorMessage('Ingresa un código CVC/CVV válido.');
                    return;
                }

                setIsProcessingPayment(true);

                // Simulate secure payment gateway API call
                setTimeout(() => {
                    setIsProcessingPayment(false);
                    const refCode = 'CAN-' + Math.floor(100000 + Math.random() * 900000);
                    setPaymentReference(refCode);
                    setPaymentSuccess(true);
                    setStep(4);
                }, 1800);
            };

            const generateWhatsAppLink = () => {
                const addOnUSD = paymentData.includeVIP ? AGENCY_CONFIG.vipServiceFeeUSD : 0;
                const grandTotalUSD = evaluationResult.totalUSD + addOnUSD;
                const grandTotalMXN = Math.round(grandTotalUSD * AGENCY_CONFIG.usdToMxnRate);

                let etaText = 'Ninguno (Aplica Visa VAM)';
                if (formData.etaCondition === 'us_visa') etaText = 'Visa EE.UU. Vigente';
                if (formData.etaCondition === 'canada_visa') etaText = 'Visa Canadá Previa';
                if (formData.etaCondition === 'both') etaText = 'Visa EE.UU. + Canadá Previa';

                const text = 
`🇨🇦 *SOLICITUD INTEGRAL & CITA - VISA CANADÁ* 🇨🇦
----------------------------------
📌 *Cliente:* ${formData.fullName || 'No especificado'}
📱 *Teléfono:* ${formData.phoneCode || '+52'} ${formData.phone || 'No especificado'}
✉️ *Email:* ${formData.email || 'No especificado'}

📊 *DIAGNÓSTICO:*
• *Puntuación:* ${evaluationResult.score}% (${evaluationResult.badgeText})
• *Trámite:* ${evaluationResult.visaType}
• *Condición eTA:* ${etaText}

📅 *CITA DE ALINEACIÓN SELECCIONADA:*
• *Fecha:* ${appointmentData.preferredDate}
• *Horario:* ${appointmentData.preferredTimeSlot}
• *Modalidad:* ${appointmentData.attendanceType}
${!evaluationResult.isEtaEligible ? `• *Sede Biométrica Deseada:* ${appointmentData.preferredBiometricsCity}\n` : ''}
📋 *DESGLOSE FINANCIERO:*
• Tasa Oficial Gobierno IRCC: $${evaluationResult.govFeeUSD} USD
• Honorarios de Tramitación: $${evaluationResult.serviceFeeUSD} USD
${paymentData.includeVIP ? `• Servicio VIP Fast-Track: +$${AGENCY_CONFIG.vipServiceFeeUSD} USD\n` : ''}
💰 *TOTAL PAGADO:* $${grandTotalUSD} USD (~$${grandTotalMXN.toLocaleString('es-MX')} MXN)

💳 *PAGO CONFIRMADO:* Ref. ${paymentSuccess ? paymentReference : 'Pendiente'}

Hola, he completado mi evaluación, pago y agendamiento en el portal. Deseo confirmar mi cita para revisar mi expediente pre-llenado por la agencia.`;

                return `https://wa.me/${AGENCY_CONFIG.whatsappNumber}?text=${encodeURIComponent(text)}`;
            };

            const resetForm = () => {
                localStorage.removeItem(STORAGE_KEY);
                setStep(1);
                setPaymentSuccess(false);
                setPaymentReference('');
                setCheckedDocs({});
                setFormData({
                    fullName: '',
                    phone: '',
                    phoneCode: '+52',
                    email: '',
                    nationality: 'Mexicana',
                    etaCondition: 'us_visa',
                    travelPurpose: 'Turismo / Vacaciones',
                    employmentStatus: 'Empleado con Contrato',
                    monthlyIncome: '1,200 - 2,500 USD',
                    travelHistory: 'us_and_others',
                    legalBackground: 'clean'
                });
            };

            return (
                <div className="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden my-4 transition-all">
                    {/* Direct Government Embassies Links Header Bar */}
                    <div className="bg-slate-950 text-slate-300 px-4 py-2.5 text-xs border-b border-slate-800 flex flex-wrap items-center justify-between gap-2">
                        <div className="flex items-center gap-2">
                            <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                            <span className="font-semibold text-white">Accesos Directos a Portales Oficiales de Gobierno:</span>
                        </div>
                        <div className="flex items-center gap-2">
                            <a 
                                href={OFFICIAL_DIRECT_LINKS.canadaEtaOfficial}
                                target="_blank"
                                rel="noopener noreferrer"
                                className="inline-flex items-center gap-1.5 px-2.5 py-1 bg-red-950/80 hover:bg-red-900 text-red-200 rounded-lg border border-red-700/50 font-medium transition-all"
                            >
                                <span>🇨🇦 Embajada / eTA Canadá (IRCC)</span>
                                <Icons.ExternalLink />
                            </a>
                            <a 
                                href={OFFICIAL_DIRECT_LINKS.usVisaOfficial}
                                target="_blank"
                                rel="noopener noreferrer"
                                className="inline-flex items-center gap-1.5 px-2.5 py-1 bg-blue-950/80 hover:bg-blue-900 text-blue-200 rounded-lg border border-blue-700/50 font-medium transition-all"
                            >
                                <span>🇺🇸 Citas Visas EE.UU. (DS-160)</span>
                                <Icons.ExternalLink />
                            </a>
                        </div>
                    </div>

                    {/* Header */}
                    <div className="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 text-white p-6 md:p-8">
                        <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <div>
                                <div className="inline-flex items-center gap-2 bg-red-600/20 text-red-300 border border-red-500/30 px-3 py-1 rounded-full text-xs font-semibold uppercase tracking-wider mb-2">
                                    <Icons.Plane />
                                    <span>Servicio Especializado Canadá IRCC</span>
                                </div>
                                <h1 className="text-2xl md:text-3xl font-extrabold tracking-tight">
                                    Portal de Evaluación & Tramitación Visa Canadá
                                </h1>
                                <p className="text-slate-300 text-sm mt-1">
                                    Servicio integral llave en mano: nos encargamos del 100% de la tramitación y tasas.
                                </p>
                            </div>
                            <div className="flex items-center gap-3 bg-white/10 backdrop-blur-md px-4 py-2.5 rounded-xl border border-white/10 self-start md:self-auto">
                                <Icons.ShieldCheck />
                                <div className="text-xs">
                                    <div className="font-semibold text-emerald-400">Garantía Integral</div>

                                                    type="text"

                                                        type="text"
                                                        required
                                                        placeholder="4500 0000 0000 0000"
                                                        value={paymentData.cardNumber}

                                                        value={paymentData.expiry}

                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-semibold text-slate-700 mb-1">Código CVC / CVV</label>
                                                    <input 
                                                        type="password"
                                                        required
                                                        maxLength="4"
                                                        placeholder="123"
                                                        value={paymentData.cvv}
                                                        onChange={(e) => setPaymentData(prev => ({ ...prev, cvv: e.target.value.replace(/\D/g, '') }))}
                                                        className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-mono text-center"
                                                    />
                                                </div>
                                            </div>

                                            {errorMessage && (

                                                    ← Volver
                                                </button>

                                                <button

                                                            <div className="w-4 h-4 border-2 border-slate-950 border-t-transparent rounded-full animate-spin"></div>

                                                        <>
                                                            <Icons.Lock />
                                                            <span>Pagar ${evaluationResult.totalUSD + (paymentData.includeVIP ? AGENCY_CONFIG.vipServiceFeeUSD : 0)} USD y Seleccionar Cita</span>
                                                        </>
                                                    )}
                                                </button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        )}

                        {}
                        {step === 4 && (
                            <div className="space-y-6 max-w-3xl mx-auto py-2">
                                <div className="text-center space-y-2">
                                    <div className="inline-flex items-center justify-center w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full mb-1">
                                        <Icons.CheckCircle className="w-10 h-10 text-emerald-600" />

                                    <h2 className="text-2xl font-extrabold text-slate-900">
                                        ¡Pago Confirmado & Registro Exitoso!

                                    </p>

                                {/* Interactive Appointment Scheduler Box */}
                                <div className="bg-indigo-50/70 border border-indigo-200 p-6 rounded-2xl space-y-5">
                                    <div className="flex items-center gap-2.5 border-b border-indigo-200/80 pb-3">

                                            <h3 className="text-sm font-bold text-indigo-950">

                                                <option value="Mañana (09:00 - 12:00 hrs)">Mañana (09:00 - 12:00 hrs)</option>

                                                <option value="Videollamada por WhatsApp">Videollamada por WhatsApp</option>
                                                <option value="Llamada Telefónica Directa">Llamada Telefónica Directa</option>

                                        {!evaluationResult.isEtaEligible && (
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-700 mb-1">Sede de Huellas Preferida (VFS Global)</label>
                                                <select
                                                    value={appointmentData.preferredBiometricsCity}

                                                >
                                                    <option value="Ciudad de México (VFS Global CDMX)">Ciudad de México (CDMX)</option>
                                                    <option value="Monterrey (VFS Global MTY)">Monterrey, N.L.</option>
                                                    <option value="Guadalajara (VFS Global GDL)">Guadalajara, Jal.</option>
                                                </select>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {/* Order Receipt Card */}
                                <div className="bg-slate-50 p-5 rounded-2xl border border-slate-200 text-left space-y-2.5 text-xs">
                                    <div className="flex justify-between items-center border-b border-slate-200 pb-2.5">
                                        <span className="text-slate-500">Solicitante:</span>
                                        <span className="font-semibold text-slate-800">{formData.fullName || 'Registrado'}</span>
                                    </div>
                                    <div className="flex justify-between">
                                        <span className="text-slate-500">Puntuación de Viabilidad:</span>
                                        <span className="font-bold text-emerald-600">{evaluationResult.score}% (Aprobación Alta)</span>
                                    </div>
                                    <div className="flex justify-between">
                                        <span className="text-slate-500">Trámite Correspondiente:</span>
                                        <span className="font-semibold text-indigo-700">{evaluationResult.visaType}</span>
                                    </div>
                                </div>

                                {/* Main WhatsApp Call-to-Action */}
                                <div className="bg-emerald-50 border border-emerald-200 p-6 rounded-2xl space-y-4 text-center">
                                    <h3 className="text-base font-bold text-emerald-950">
                                        🚀 Confirmar Cita y Enviar Ficha por WhatsApp
                                    </h3>
                                    <p className="text-xs text-emerald-800">
                                        Haz clic en el siguiente botón para enviar tu horario seleccionado y ficha técnica pre-llenada directamente a nuestro WhatsApp (+52 771 747 1124).
                                    </p>

                                    <a
                                        href={generateWhatsAppLink()}
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        className="inline-flex items-center justify-center gap-3 w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-4 px-6 rounded-xl shadow-lg transition-all text-base"
                                    >
                                        <Icons.WhatsApp />
                                        <span>Confirmar Cita por WhatsApp (+52 771 747 1124)</span>
                                    </a>
                                </div>

                                <div className="pt-2 flex justify-center">
                                    <button
                                        type="button"
                                        onClick={resetForm}
                                        className="text-xs text-slate-500 hover:text-slate-800 flex items-center gap-1.5 underline"
                                    >
                                        <Icons.Refresh />
                                        <span>Iniciar una nueva evaluación</span>
                                    </button>
                                </div>
                            </div>
                        )}

                    </div>

                    {}
                    <div className="bg-slate-50 border-t border-slate-200 px-6 py-4 flex flex-col sm:flex-row items-center justify-between text-2xs text-slate-500 gap-2">
                        <div>
                            © 2026 {AGENCY_CONFIG.agencyName} • Gestión de Visados y eTA Canadá
                        </div>
                        <div className="flex items-center gap-4">
                            <span>Aviso de Privacidad</span>
                            <span>•</span>
                            <span>Términos del Servicio</span>
                            <span>•</span>
                            <span className="text-emerald-600 font-semibold">Garantía de Tramitación</span>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

<html lang="es">
<head>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
